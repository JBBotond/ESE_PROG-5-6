# Available runners configured by board.cmake.
runners:
- linkserver
- jlink

# Default flash runner if --runner is not given.
flash-runner: linkserver

# Default debug runner if --runner is not given.
debug-runner: linkserver

# Common runner configuration values.
config:
  board_dir: /home/boti/sdks/mcuxsdk_official/mcuxsdk/examples/_boards/frdmmcxn947
  # Build outputs:
  bin_file: mcxn947-bmp280_cm33_core0.bin
  elf_file: mcxn947-bmp280_cm33_core0.elf
  hex_file: mcxn947-bmp280_cm33_core0.hex
  # Host tools:
  gdb: /home/boti/.mcuxpressotools/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-gdb

# Runner specific arguments
args:
  linkserver:
    - --dt-flash=y
    - --device=MCXN947:FRDM-MCXN947
    - --core=cm33_core0
  jlink:
    - --dt-flash=y
    - --device=MCXN947_M33_0
